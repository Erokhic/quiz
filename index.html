<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космический квиз</title>
    <script src="start.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="start-screen" class="screen active">
        <h1>Космический квиз</h1>
        <input type="text" class="name" placeholder="Введите имя" required>
        <p class="name_error"></p>
        <button type="button" id="startBtn">Начало квиза</button>

    </div>

    <div id="quiz-screen" class="screen">
            <div class="screen-content">
                <h2 id="question-text"></h2>
                
                <div class="answers-container" id="answers-container">
           
                </div>
                
                <button id="next-btn" class="btn" disabled>Далее</button>
            </div>
        </div>


        <div id="results-screen" class="screen">
            <div class="screen-content">
                <h1>Результаты</h1>
                <div class="score" id="score-text"></div>
                
                <div class="results-container" id="results-container">
                </div>
                
                <button id="restart-btn" class="btn">Пройти ещё раз</button>

</body>

</html>
